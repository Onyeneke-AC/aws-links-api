# Reusable: deploy one environment with an image that's already in ECR.
# Called by main.yml for dev, then (after approval) for prod with the SAME tag.
#
#   1. terraform apply -var image_tag=<sha>   (make deploy)
#   2. check what ECS is really running       (make rollout-check)
#   3. end-to-end test through the ALB        (make smoke)
#
# Any failure stops the pipeline, so a broken build never reaches prod.

name: deploy

on:
  workflow_call:
    inputs:
      environment:
        description: dev or prod
        type: string
        required: true
      image_tag:
        description: Git commit SHA of the image in ECR
        type: string
        required: true

permissions: {}

env:
  TERRAFORM_VERSION: "1.17.2"

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # a first deploy includes RDS creation (~10 min)

    # The GitHub environment: restricted to main (repo settings) and the
    # source of this job's OIDC sub ("environment:<env>"), which is what the
    # links-gha-apply-<env> role trusts.
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.url }}

    # One deploy per environment at a time; a second one waits, never cancels
    # a half-finished apply.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false

    permissions:
      contents: read
      id-token: write

    env:
      ENV: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      # Environment secret (optional): where SLO alerts are emailed.
      TF_VAR_alarm_email: ${{ secrets.ALARM_EMAIL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      # AWS_APPLY_ROLE_ARN is an environment variable in GitHub: dev and prod
      # each hold their own role, so this job can't pick the wrong one.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-apply-${{ inputs.environment }}-${{ github.run_id }}

      - name: Terraform apply
        run: make deploy APPLY_ARGS="-auto-approve -input=false -no-color -lock-timeout=300s"

      - name: Check the new image is really running (not rolled back)
        run: make rollout-check

      - name: Smoke test
        run: make smoke

      - name: Environment URL
        id: url
        if: always()
        run: echo "url=$(terraform -chdir=infra/live output -raw public_url 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
