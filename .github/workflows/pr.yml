# Checks every pull request into main. Nothing here changes AWS: the image is
# built and scanned but never pushed, and Terraform only plans (read-only role).
#
#   app        lint, dependency audit, unit + integration tests (real Postgres)
#   image      arm64 build, size budget, Trivy vulnerability scan
#   terraform  fmt, validate, plan dev + prod -> one PR comment, updated per push

name: pr

on:
  pull_request:
    branches: [main]

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Default: no token permissions at all. Each job asks for what it needs.
permissions: {}

env:
  TERRAFORM_VERSION: "1.17.2"
  IMAGE_SIZE_LIMIT_MB: "150"

jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    # Same database as compose.yaml, so the tests' defaults just work.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: links
          POSTGRES_PASSWORD: links-local-only
          POSTGRES_DB: links
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U links"
          --health-interval 2s --health-timeout 5s --health-retries 15

    steps:
      # Actions are pinned to a commit SHA: a tag like @v7 can be moved to
      # different code, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      # Runtime dependencies only: dev tools (eslint) never ship in the image.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fargate runs ARM64; the runner is x86. QEMU emulates only the runtime
      # stage (apk add); the npm stage builds natively ($BUILDPLATFORM).
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: links-api:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Size budget (uncompressed, the stricter measure) + Trivy (fails on
      # fixable HIGH/CRITICAL). Same script as the main pipeline.
      - name: Size budget and vulnerability scan
        run: scripts/image-checks.sh "links-api:pr-${GITHUB_SHA}"

  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC: exchange GitHub's token for AWS credentials
      pull-requests: write # post the plan comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - run: make tf-fmt
      - run: make tf-validate

      # links-gha-plan trusts only pull requests from this repo; read-only.
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-plan-${{ github.run_id }}

      # Same Makefile target as on a laptop. A failed plan still gets posted.
      - name: Plan dev
        id: plan_dev
        continue-on-error: true
        shell: bash
        run: make plan ENV=dev PLAN_ARGS="-no-color -input=false -lock-timeout=120s" 2>&1 | tee plan-dev.txt

      - name: Plan prod
        id: plan_prod
        continue-on-error: true
        shell: bash
        run: make plan ENV=prod PLAN_ARGS="-no-color -input=false -lock-timeout=120s" 2>&1 | tee plan-prod.txt

      - name: Comment plans on the PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEV_OUTCOME: ${{ steps.plan_dev.outcome }}
          PROD_OUTCOME: ${{ steps.plan_prod.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- terraform-plan -->';
            const MAX = 30000; // GitHub comments are capped at 65,536 chars

            function section(env, outcome) {
              let text = '';
              try { text = fs.readFileSync(`plan-${env}.txt`, 'utf8'); } catch { text = '(no output)'; }
              const summary = (text.match(/^(Plan: .*|No changes\..*)$/m) || [])[0]
                || (outcome === 'success' ? 'see details' : 'plan FAILED');
              if (text.length > MAX) text = '... (truncated, see the job log)\n' + text.slice(-MAX);
              const icon = outcome === 'success' ? '✅' : '❌';
              return `### ${icon} ${env}: ${summary}\n<details><summary>Show plan</summary>\n\n\`\`\`\n${text}\n\`\`\`\n</details>\n`;
            }

            const body = [
              marker,
              '## Terraform plan',
              section('dev', process.env.DEV_OUTCOME),
              section('prod', process.env.PROD_OUTCOME),
              `<sub>Commit ${context.sha.slice(0, 7)} · read-only role, nothing was changed.</sub>`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Fail if a plan failed
        if: steps.plan_dev.outcome != 'success' || steps.plan_prod.outcome != 'success'
        run: exit 1
