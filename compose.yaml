# Local development only. In AWS the app talks to RDS Postgres 18.
services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: links
      POSTGRES_PASSWORD: links-local-only # throwaway local credential, never used in AWS
      POSTGRES_DB: links
    ports:
      - "127.0.0.1:5432:5432" # loopback only, not exposed to the LAN
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U links -d links"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql # throwaway data; `npm run db:down` resets everything

